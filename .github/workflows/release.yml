name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: ibkr-ir-linux-x86_64
            binary: dist/ibkr-ir
          - os: windows-latest
            artifact_name: ibkr-ir-windows-x86_64
            binary: dist/ibkr-ir.exe
          - os: macos-latest
            artifact_name: ibkr-ir-macos-arm64
            binary: dist/ibkr-ir

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build binary
        run: pyinstaller --clean ibkr-ir.spec

      - name: Smoke test
        run: |
          "${{ matrix.binary }}" --year 2025 --statement examples/sample_statement.csv
          test -f output/irpf-2025.html

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p release
          cp "${{ matrix.binary }}" "release/${{ matrix.artifact_name }}"
          cp docs/guia-ibkr-ir.html "release/guia-ibkr-ir.html"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/${{ matrix.artifact_name }}
            release/guia-ibkr-ir.html

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
